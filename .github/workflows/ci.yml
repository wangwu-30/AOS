name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        include:
          - python-version: "3.14"
            experimental: true

    defaults:
      run:
        shell: bash
        working-directory: agentos-next

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: agentos-next/pyproject.toml

      - name: Install Dev Extras
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"

      - name: Ruff (required)
        run: |
          set -euo pipefail
          ruff check src tests

      - name: Run Unit Tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
